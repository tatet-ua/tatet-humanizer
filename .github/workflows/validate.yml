name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Перевірки узгодженості пакета
        run: node scripts/validate.mjs

      - name: Хук мовчить на власній документації
        run: |
          for f in SKILL.md README.md AGENTS.md references/*.md; do
            out=$(echo "{\"tool_input\":{\"file_path\":\"$f\"}}" | node claude-code/hooks/check-text.mjs)
            if [ -n "$out" ]; then
              echo "Хук спрацював на $f, хоча має пропускати власну документацію."
              echo "$out"
              exit 1
            fi
          done
